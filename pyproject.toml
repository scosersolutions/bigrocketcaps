[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigrocketcaps"
version = "0.1.0"
description = "Laboratorio cuantitativo de acciones US. Busca refutar, no confirmar."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Windows no trae la base de datos IANA; DuckDB la pide vía pytz.
    "tzdata>=2024.1",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# Subir el lago a Hugging Face. Aparte a propósito: exportar y restaurar la
# copia no pueden depender de un SDK de red.
lago = [
    "huggingface-hub>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
