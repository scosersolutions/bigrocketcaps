# B2 · Entrada de un activista y presión alcista
#
# ESCRITA ANTES DE MEDIR. Ni una cifra de este fichero sale de haber mirado el
# resultado. Si algo de aquí se cambia después de medir, la hipótesis queda
# quemada y hay que abrir otra, que consume otro contraste.
#
# Forma parte del BLOQUE de cuatro (B2..B5) declarado de golpe el 2026-09-18.
# De golpe y no una a una a propósito: correrlas en serie y publicar la que
# salga bien es mirar cuatro sitios y enseñar el bonito. Declaradas juntas, el
# contador de contrastes sube el listón para las cuatro, y si alguna sobrevive
# lo hace habiendo pagado el precio de las otras tres.

id = "B2"
titulo = "La entrada declarada de un activista produce exceso POSITIVO a corto plazo"
estado = "SELLADA"
autor = "fernando"
escrita = "2026-09-18"

[mecanismo]
# Por qué DEBERÍA funcionar, escrito antes de saber si funciona.
texto = """
Un 13D se presenta cuando alguien supera el 5 % del capital CON INTENCIÓN DE
INFLUIR. Esa es la diferencia con el 13G, que es la misma participación
declarada como pasiva: lo que el 13D hace público no es el tamaño, es el
propósito.

Y el propósito tiene una dirección sola. Nadie compra el 5 % de una empresa
para empeorarla. Lo que viene detrás de un 13D es presión para liberar valor:
asientos en el consejo, venta de activos, recompras, recorte de gasto. El
mercado puede poner precio a esa presión el día que se entera de que existe.

La literatura académica lo documenta desde Brav et al. (2008) sobre activismo
de hedge funds. Que esté documentado no lo hace cierto aquí: los trabajos
miden otras muestras, otras épocas y otra forma de medir el exceso. Por eso se
mide, en vez de citarse.
"""
direccion = "largo"
por_que_no_al_reves = """
Se podría argumentar lo contrario: que un activista entre señala que la empresa
está rota, y eso es mala noticia. Pero que esté rota ya estaba en el precio
antes del 13D —el activista compró porque estaba barata, no la abarató él—. Lo
que la presentación añade es la PRESIÓN, no el diagnóstico.
"""

[universo]
mercado = "stock_us"
fuente_eventos = "eventos_societarios, clase = posicion_activista"
minimo_velas_previas = 60
ventana = "validacion"   # la mitad de sectores que NO se explora

[periodos]
validacion = "2018-01-01 .. 2024-12-31"
holdout = "2026-01-01 .. 2027-01-01"
reserva = "2025-01-01 .. 2025-12-31"

[senal]
entrada = "cierre de la primera sesión en que el mercado pudo reaccionar"
horizonte_sesiones = 5
# Mismo horizonte que B1, y por el mismo motivo: el hecho es público y
# cuantificable el día que se presenta. Se fija aquí, antes de ver un número.
# No se prueban otros: eso costaría más contrastes y elegir el mejor después
# no significaría nada.

[referencia]
tipo = "mediana del universo con precio ese día"

[costes]
modelo = "CostesPorAccion"
nota = """
El spread de acciones US no se puede medir gratis desde el 1-feb-2025. Se usa
el ESTIMADO (Corwin-Schultz, procedencia = estimado), que sobrestima: sirve
para absolver esta hipótesis si sobrevive a él, no para condenarla si muere.
El criterio que manda es el de equilibrio: a qué horquilla deja de funcionar.
"""

[criterios_refutacion]
# Cualquiera de estos mata la hipótesis. Escritos antes de medir.
1 = "El exceso medio a 5 sesiones NO es positivo."
2 = "El exceso no supera al azar: percentil < 95 contra carteras aleatorias equivalentes."
3 = "El efecto desaparece al dejar pasar una sesión entre el evento y la entrada (sería rebote de horquilla, no evento)."
4 = "El efecto vive solo en un tramo de años: cambia de signo entre 2018-2021 y 2022-2024."
5 = "El efecto depende de menos de 20 empresas distintas."
6 = "La mediana del exceso es negativa aunque la media sea positiva (sería cola, no efecto)."

[presupuesto]
contrastes = 1
justificacion = """
Una celda: una definición, un horizonte, una referencia. El bloque B2..B5
consume 4 contrastes en total, declarados el mismo día y antes de medir
ninguno.
"""

[alcance]
fuera = """
NO se separa 13D de sus enmiendas. NO se prueban otros horizontes. NO se divide
por tamaño de participación, por tipo de activista ni por sector. Si B2
sobrevive, cualquiera de esas cosas es una hipótesis NUEVA con su contraste.
"""
