# Estima la horquilla de acciones US desde el OHLC diario del lago.
#
# ## Por que ya no mide
#
# Medirla era el plan, y GitHub Actions era el sitio porque habia que muestrear
# el libro con el mercado abierto. Desde el 1-feb-2025 IEX exige un Data
# Subscriber Agreement firmado para el TOPS en tiempo real: sin el, Tiingo
# devuelve `bidPrice` y `askPrice` a NULL, y la tarifa de IEX lo pone en
# 500 $/mes. Con el suelo de coste en cero, esa puerta esta cerrada. El detalle
# entero, con numeros, en `brc.estudio.horquilla`.
#
# ## Por que ya no hay cron
#
# Lo que medimos ya no es el presente: es una estimacion sobre el historico del
# lago. Solo cambia cuando el lago gana sesiones nuevas, que no pasa a diario y
# desde luego no a una hora concreta. Un cron aqui seria ruido en el historial y
# minutos de runner quemados para reescribir el mismo fichero.
#
# Se lanza a mano -o desde el Centro de Control, que es `github_actions` sobre
# este mismo fichero- cuando el lago se haya actualizado.

name: Horquilla US

on:
  workflow_dispatch:
    inputs:
      estimador:
        description: "cs = Corwin-Schultz, ar = Abdi-Ranaldo"
        type: choice
        options:
          - cs
          - ar
        default: cs

permissions:
  contents: write

concurrency:
  group: horquilla
  cancel-in-progress: false

jobs:
  estimar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Estimar la horquilla
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
          # Un token por automatizacion: el SDK comprueba que el token
          # corresponde al slug y se niega si no.
          CONTROL_CENTER_TOKEN: ${{ secrets.CONTROL_CENTER_TOKEN_HORQUILLA }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::falta el secreto HF_TOKEN; el lago es privado"
            exit 1
          fi
          # El anillo de `con_control` no puede impedir estimar: sin las dos
          # variables de arriba ejecuta el comando y no reporta nada.
          python scripts/con_control.py --slug brc-horquilla \
            --resultado horquilla=data/experimentos/spread_us.json \
            --resumen "horquilla {horquilla.mediana_de_p90s} bps, peor activo {horquilla.maximo_de_p90s} bps" \
            -- python scripts/estimar_horquilla.py --estimador "${{ inputs.estimador || 'cs' }}"

      - name: Guardar la estimacion
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/experimentos/spread_us.json
          # Solo se commitea si cambio algo MAS que la marca de tiempo. Sin
          # esto, cada ejecucion dejaba un commit identico al anterior salvo el
          # campo `medido`: tres seguidos con la misma mediana de 111,59 bps. El
          # historial dejaba de leerse como la serie -que es su unico motivo de
          # existir- y ademas cada commit de adorno es una ocasion de chocar
          # con quien este tocando el fichero en local.
          sustancia=$(git diff --staged -U0 -- data/experimentos/spread_us.json \
            | grep -E '^[+-]' | grep -vE '^(---|[+][+][+])' | grep -vc '"medido"' || true)
          if [ "$sustancia" -eq 0 ]; then
            echo "solo cambia la marca de tiempo: no se commitea"
            git restore --staged data/experimentos/spread_us.json
            exit 0
          fi
          # La mediana va en el asunto: asi `git log --oneline` se lee como la
          # serie de la horquilla, sin abrir un solo fichero.
          med=$(python -c "import json;d=json.load(open('data/experimentos/spread_us.json'));print(f\"{d['mediana_de_p90s']:.2f}\")")
          git diff --staged --quiet || git commit -m "chore: horquilla US $(date -u +%Y-%m-%d) · mediana $med bps"
          git pull --rebase
          git push
