# Mide la horquilla real de acciones US, con el mercado abierto.
#
# ## Por que en Actions y no en el portatil
#
# Hay que muestrear durante media hora con el mercado abierto, o sea entre las
# 13:30 y las 20:00 UTC. Depender de que el portatil este encendido a esa hora
# es depender de una casualidad; el job corre igual.
#
# ## Por que a diario y no una sola vez
#
# Una medicion basta para calibrar, pero repetirla cuesta 20 peticiones de las
# 500 diarias de Tiingo y a cambio da algo que una sola no da: la EVOLUCION.
# La liquidez cambia, y un modelo de costes calibrado hace un año puede estar
# cobrando de menos hoy.
#
# La serie no necesita codigo: cada ejecucion commitea su medicion, asi que
# `git log data/experimentos/spread_us.json` ES el historico.
#
# A las 14:23 y no a las 14:00: GitHub retrasa o DESCARTA las ejecuciones
# programadas cuando hay carga, y los minutos redondos son los mas pedidos con
# diferencia. Medido en MoonRocket: con `5 * * * *` la ejecucion de las 22:05
# no llego a existir a las 22:44.

name: Horquilla US

on:
  schedule:
    # 14:23 UTC, de lunes a viernes: mercado abierto (13:30-20:00) y con margen
    # por si GitHub retrasa el disparo.
    - cron: "23 14 * * 1-5"
  workflow_dispatch:
    inputs:
      instantaneas:
        description: "Cuantas instantaneas tomar"
        default: "60"
      pausa:
        description: "Segundos entre instantaneas"
        default: "30"

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Comprobar que el mercado esta abierto
        # 13:30-20:00 UTC. Fuera de esa franja no hay libro que medir y el job
        # se para aqui en vez de gastar media hora para nada.
        run: |
          h=$(date -u +%H%M)
          if [ "$h" -lt 1330 ] || [ "$h" -gt 1930 ]; then
            echo "::error::son las $h UTC; el mercado US cotiza de 13:30 a 20:00"
            exit 1
          fi
          echo "hora UTC $h: dentro de sesion"

      - name: Muestrear la horquilla
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: |
          if [ -z "$TIINGO_TOKEN" ]; then
            echo "::error::falta el secreto TIINGO_TOKEN"
            exit 1
          fi
          # El `default:` de `workflow_dispatch.inputs` NO se aplica cuando
          # el disparo es `schedule`: ahi `inputs.*` llega VACIO y el script
          # moria con `invalid int value: ''` (ejecucion 35133028946, del
          # 2026-09-16). El valor por defecto va aqui tambien, que es el
          # unico sitio por el que pasan los dos disparos.
          python scripts/medir_spread_us.py \
            --instantaneas "${{ inputs.instantaneas || '60' }}" \
            --pausa "${{ inputs.pausa || '30' }}"

      - name: Guardar la medicion
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/experimentos/spread_us.json
          # La mediana va en el asunto del commit: asi `git log --oneline` se
          # lee como la serie temporal del spread, sin abrir un solo fichero.
          med=$(python -c "import json;d=json.load(open('data/experimentos/spread_us.json'));a=d['activos'];import statistics;print(f\"{statistics.median([v['mediana_bps'] for v in a.values()]):.2f}\" if a else 'sin datos')")
          git diff --staged --quiet || git commit -m "chore: horquilla US $(date -u +%Y-%m-%d) · mediana $med bps"
          git push
