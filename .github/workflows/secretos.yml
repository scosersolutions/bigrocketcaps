# Busca credenciales en el historial completo, en cada empujón.
#
# ## Por qué no se usa la action oficial de gitleaks
#
# `gitleaks/gitleaks-action` pide `GITLEAKS_LICENSE` cuando el repositorio
# pertenece a una organización, y esa licencia se paga. Aquí el coste tiene que
# ser cero de verdad y no «cero mientras siga siendo una cuenta personal», así
# que se descarga el binario, que es gratis siempre y no depende de a nombre de
# quién esté el repositorio.
#
# ## Por qué el hash va escrito aquí
#
# Verificar la descarga contra el fichero de checksums del MISMO release solo
# protege de una descarga corrupta: quien pudiera cambiar el binario podría
# cambiar también ese fichero. El SHA256 escrito abajo se comprobó el
# 2026-09-15 y se cambia a mano al subir de versión, que es justo el momento en
# que alguien debe mirarlo.
#
# ## Qué se escanea
#
# El historial ENTERO, no el último empujón. Un secreto que entró hace seis
# meses y se borró al día siguiente sigue estando en el historial, y es
# exactamente el que se publicaría al hacer el repositorio público. Son 218
# commits y 388 MB en menos de siete segundos: no hay motivo para mirar menos.
#
# Los falsos positivos revisados van en `.gitleaksignore`, que gitleaks lee
# solo, con el motivo escrito al lado de cada uno.

name: Secretos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # sin esto solo llega el último commit, y el
                            # historial es justo lo que hay que mirar

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          ./gitleaks version

      - name: Escanear el historial completo
        # --redact: si algún día hay un hallazgo de verdad, el valor NO se
        # imprime en un log que además se vuelve público con el repositorio.
        # Encontrarlo no puede ser la forma de publicarlo.
        run: ./gitleaks git . --log-opts="--all" --redact --verbose

      - name: Qué hacer si esto falla
        if: failure()
        run: |
          echo "::error::gitleaks ha encontrado algo. Antes de tocar nada:"
          echo "1. Mirar el hallazgo. Si es un valor de prueba, va a"
          echo "   .gitleaksignore CON EL MOTIVO escrito, no con un 'revisado'."
          echo "2. Si es real, ROTARLO primero en el servicio que lo emitió."
          echo "   Borrarlo del historial no lo invalida: quien ya lo tenga,"
          echo "   lo sigue teniendo."
          echo "3. Solo después, reescribir el historial si hace falta."
